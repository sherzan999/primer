/* Layout: full-bleed dark bands, content in a 1200px column; one orange light source per section */
:root {
  --bg: #0E0E10;
  --bg-2: #141417;

  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; overflow-x: clip; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-weight: 300; font-size: 16px; line-height: 1.6; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--bg); }
h1, h2, h3, .display { font-family: var(--font-display); text-wrap: balance; letter-spacing: -0.02em; }
.wrap { max-width: 1200px; margin-inline: auto; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-family: var(--font-display); font-size: 12px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); }
.muted { color: var(--muted); }
.tnum { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

/* header */
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; transition: background .3s, border-color .3s; border-bottom: 1px solid transparent; }
.site-header.scrolled { background: rgba(14,14,16,0.78); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-color: var(--line); }

/* buttons */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 10px; height: 52px; padding: 0 26px; border-radius: 999px; font-family: var(--font-display); font-weight: 600; font-size: 15px; letter-spacing: 0.01em; cursor: pointer; transition: transform .2s ease, box-shadow .25s ease, background .25s; white-space: nowrap; border: 0; }
.btn-primary { background: var(--accent); color: #140700; box-shadow: 0 8px 30px -8px rgba(255,90,31,.7); }
.btn-primary:hover { box-shadow: 0 10px 44px -6px rgba(255,90,31,.95); }
.btn-ghost { background: rgba(255,255,255,0.06); color: var(--fg); border: 1px solid rgba(255,255,255,0.16); }
.btn-ghost:hover { background: rgba(255,255,255,0.11); }
.btn .arrow { transition: transform .25s ease; }
.btn:hover .arrow { transform: translateX(4px); }

/* glass */
.glass { background: linear-gradient(160deg, rgba(255,255,255,0.09), rgba(255,255,255,0.02)); border: 1px solid rgba(255,255,255,0.12); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); box-shadow: 0 20px 60px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.08); }

/* hero */
.hero { position: relative; min-height: 100svh; display: flex; align-items: flex-end; overflow: hidden; isolation: isolate; }
.hero-scene { position: absolute; inset: -6% 0 0 0; z-index: -2; }
.hero-scene svg { width: 100%; height: 100%; display: block; }
.hero::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(180deg, rgba(14,14,16,.55) 0%, rgba(14,14,16,0) 30%, rgba(14,14,16,.2) 60%, var(--bg) 100%), linear-gradient(90deg, rgba(14,14,16,.85) 0%, rgba(14,14,16,.2) 55%, rgba(14,14,16,0) 100%); }
.hero h1 { font-size: clamp(42px, 7.4vw, 104px); line-height: .95; font-weight: 700; }
.hero h1 em { font-style: normal; color: var(--accent); }
@media (max-width: 767px) {
  .hero { display: block; min-height: 0; }
  .hero-scene { inset: 0 0 auto 0; height: 330px; }
  .hero-content { padding-block: 290px 56px !important; }
  .hero::after { background: linear-gradient(180deg, rgba(14,14,16,.5) 0%, rgba(14,14,16,0) 22%, rgba(14,14,16,0) 55%, var(--bg) 82%); }

.spec { font-family: var(--font-display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.spec b { color: var(--fg); font-weight: 600; }

.marquee { mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }

.brand { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: .12em; text-transform: uppercase; color: rgba(242,240,238,.28); transition: color .25s, text-shadow .25s; white-space: nowrap; cursor: default; }
.brand:hover { color: var(--fg); text-shadow: 0 0 22px rgba(255,90,31,.85); }

.svc:hover .ico { background: var(--accent); color: #140700; box-shadow: 0 0 30px rgba(255,90,31,.6); }

.stat-num { font-family: var(--font-display); font-weight: 700; font-size: clamp(52px, 7vw, 88px); line-height: 1; letter-spacing: -0.04em; }

.ba { position: relative; break-inside: avoid; margin-bottom: 18px; border-radius: 20px; overflow: hidden; border: 1px solid var(--line); background: var(--bg-2); max-width: 100%; }
.ba-layer { position: absolute; inset: 0; }
.ba-layer svg { width: 100%; height: 100%; display: block; }

.ba-handle::after { content: "⟷"; position: absolute; top: 50%; left: 50%; width: 40px; height: 40px; transform: translate(-50%,-50%); border-radius: 50%; background: var(--accent); color: #140700; display: grid; place-items: center; font-size: 18px; font-weight: 700; }
.ba input[type=range] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: ew-resize; margin: 0; }
.ba-tag { position: absolute; top: 14px; padding: 4px 10px; border-radius: 999px; font-family: var(--font-display); font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; background: rgba(14,14,16,.7); backdrop-filter: blur(6px); pointer-events: none; }

.dot.on { width: 28px; background: var(--accent); }
.round-btn { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.16); background: rgba(255,255,255,.04); color: var(--fg); cursor: pointer; transition: background .2s, border-color .2s, transform .2s; }
.round-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

/* form */
.field label { display: block; font-size: 12px; font-family: var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
.field input, .field select { width: 100%; height: 54px; padding: 0 2px; background: transparent; color: var(--fg); border: 0; border-bottom: 1px solid rgba(255,255,255,.18); font: 400 17px var(--font-body); border-radius: 0; transition: border-color .2s; }
.field select option { background: #1a1a1d; color: var(--fg); }
.field input:focus, .field select:focus { outline: none; border-color: var(--accent); }

.chip { height: 40px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.14); background: transparent; color: var(--fg); font: 500 14px var(--font-body); cursor: pointer; transition: all .2s; }

.err { color: #ff8a65; font-size: 13px; margin-top: 6px; }

@media (prefers-reduced-motion: reduce) {

</g>
<g mask="url(#reflMask)" opacity=".55"><use href="#car" transform="translate(0 1436) scale(1 -1)"/></g>

function scene(kind, state, id) {
  const after = state === "after";
  const bg = `<radialGradient id="${id}bg" cx="50%" cy="35%" r="75%"><stop offset="0" stop-color="#2a2a2f"/><stop offset="1" stop-color="#0a0a0c"/></radialGradient><filter id="${id}b"><feGaussianBlur stdDeviation="6"/></filter><filter id="${id}b2"><feGaussianBlur stdDeviation="2"/></filter>`;
  const open = (defs, h = 400) => `<svg viewBox="0 0 400 ${h}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><defs>${bg}${defs}</defs><rect width="400" height="${h}" fill="url(#${id}bg)"/>`;

  if (kind === "disc") {
    const m = after
      ? `<stop offset="0" stop-color="#c9ced4"/><stop offset=".5" stop-color="#7b8087"/><stop offset="1" stop-color="#3b3e43"/>`
      : `<stop offset="0" stop-color="#8a5532"/><stop offset=".6" stop-color="#5e3621"/><stop offset="1" stop-color="#3a2214"/>`;
    let extra = "";
    if (after) {
      for (const r of [142, 128, 114, 100, 86]) extra += `<circle cx="190" cy="205" r="${r}" fill="none" stroke="#fff" stroke-opacity=".07"/>`;
      for (let i = 0; i < 18; i++) { const a = i * 20 * Math.PI / 180; extra += `<circle cx="${(190 + Math.cos(a) * 112).toFixed(1)}" cy="${(205 + Math.sin(a) * 112).toFixed(1)}" r="5" fill="#1a1b1e"/>`; }
    } else {
      const spots = [[120,140,34],[250,120,26],[260,270,40],[140,280,30],[90,210,22],[300,200,18],[200,320,24]];
      for (const [x,y,r] of spots) extra += `<circle cx="${x}" cy="${y}" r="${r}" fill="#a8622f" opacity=".45" filter="url(#${id}b)"/>`;
      for (const r of [138, 117, 96]) extra += `<circle cx="190" cy="205" r="${r}" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="3"/>`;
    }
    let bolts = "";
    for (let i = 0; i < 5; i++) { const a = (i * 72 - 90) * Math.PI / 180; bolts += `<circle cx="${(190 + Math.cos(a) * 32).toFixed(1)}" cy="${(205 + Math.sin(a) * 32).toFixed(1)}" r="7" fill="#0a0a0b"/>`; }
    return open(`<linearGradient id="${id}m" x1="0" y1="0" x2="1" y2="1">${m}</linearGradient>`) +
      `<circle cx="190" cy="205" r="150" fill="url(#${id}m)"/>${extra}
       <circle cx="190" cy="205" r="58" fill="#1a1b1e" stroke="#2c2d31" stroke-width="6"/>${bolts}
       <path d="M313,102 A160,160 0 0 1 329,285 L301,269 A128,128 0 0 0 288,123 Z" fill="${after ? "#FF5A1F" : "#4a3d34"}"/>
       ${after ? `<path d="M313,102 A160,160 0 0 1 329,285" fill="none" stroke="#ffd2b8" stroke-opacity=".6" stroke-width="2"/>` : ""}</svg>`;
  }

  if (kind === "headlight") {
    const lens = "M40,190 C70,130 300,118 360,160 C384,180 372,260 336,276 C250,308 100,300 56,266 C28,246 26,214 40,190 Z";
    const inner = after
      ? `<path d="${lens}" fill="#0b0e14"/>
         <path d="M70,178 C140,150 270,146 340,170" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" filter="url(#${id}b2)"/>
         <path d="M70,178 C140,150 270,146 340,170" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
         <circle cx="250" cy="222" r="42" fill="#15181f" stroke="#3a3f4a" stroke-width="3"/>
         <circle cx="250" cy="222" r="30" fill="url(#${id}p)"/>
         <circle cx="140" cy="226" r="30" fill="#15181f" stroke="#3a3f4a" stroke-width="3"/>
         <circle cx="140" cy="226" r="20" fill="url(#${id}p)" opacity=".8"/>
         <path d="M60,170 C130,140 280,136 350,165" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="10" filter="url(#${id}b)"/>`
      : `<path d="${lens}" fill="#7d6c3a"/>
         <circle cx="250" cy="222" r="42" fill="#5f5230"/><circle cx="140" cy="226" r="30" fill="#5f5230"/>
         <path d="${lens}" fill="#c9b778" opacity=".35" filter="url(#${id}b)"/>
         <g stroke="#d9cd9a" stroke-opacity=".35" stroke-width="1.5">
           <path d="M90,200 L170,186M120,250 L230,232M200,190 L300,206M260,262 L330,240M70,232 L140,222"/>
         </g>`;
    return open(`<radialGradient id="${id}p"><stop offset="0" stop-color="#fff"/><stop offset=".55" stop-color="#cfe4ff"/><stop offset="1" stop-color="#4b6a99"/></radialGradient>`) +
      `<path d="M0,320 C120,300 280,300 400,320 L400,400 L0,400 Z" fill="#141518"/>
       <path d="M0,110 C120,90 300,90 400,110 L400,0 L0,0 Z" fill="#141518"/>
       ${inner}
       <path d="${lens}" fill="none" stroke="#2f3238" stroke-width="5"/></svg>`;
  }

  if (kind === "rim") {
    let spokes = "";
    for (let i = 0; i < 5; i++) spokes += `<path transform="rotate(${i * 72} 200 200)" d="M190,196 L176,84 C190,78 210,78 224,84 L210,196 Z" fill="${after ? `url(#${id}s)` : "#5a5c60"}"/>`;
    const dirt = after ? "" : `<circle cx="200" cy="200" r="128" fill="#6b5a44" opacity=".35"/>
      <g stroke="#c9c9c9" stroke-opacity=".6" stroke-width="2" fill="none">
        <path d="M110,290 l10,-4 l6,6 l8,-5 l7,5 l9,-3"/><path d="M300,110 l6,9 l-2,8 l7,7"/><path d="M80,190 l3,12 l-4,9"/>
      </g>`;
    const shine = after ? `<path d="M110,120 A128,128 0 0 1 250,80" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
      <circle cx="200" cy="200" r="10" fill="#FF5A1F"/>` : "";
    return open(`<linearGradient id="${id}s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef1f4"/><stop offset=".5" stop-color="#9aa0a7"/><stop offset="1" stop-color="#4a4e55"/></linearGradient>`) +
      `<circle cx="200" cy="200" r="182" fill="#0b0b0c" stroke="#1e1e21" stroke-width="12"/>
       <circle cx="200" cy="200" r="132" fill="#101012" stroke="${after ? "#b8bec5" : "#56585c"}" stroke-width="7"/>
       ${spokes}
       <circle cx="200" cy="200" r="34" fill="${after ? "#2a2c30" : "#3a3a3c"}" stroke="${after ? "#c9ced4" : "#55575a"}" stroke-width="3"/>
       ${dirt}${shine}</svg>`;
  }

  if (kind === "paint") {
    const h = 300;
    let swirls = "";
    if (!after) for (let r = 18; r < 300; r += 16) swirls += `<circle cx="230" cy="190" r="${r}" fill="none" stroke="#fff" stroke-opacity=".07"/>`;
    return open(`<linearGradient id="${id}p" x1="0" y1="0" x2="0" y2="1">${after
        ? `<stop offset="0" stop-color="#3b3e45"/><stop offset=".45" stop-color="#121316"/><stop offset="1" stop-color="#050506"/>`
        : `<stop offset="0" stop-color="#3a3b3f"/><stop offset="1" stop-color="#26272a"/>`}</linearGradient>
        <clipPath id="${id}c"><path d="M0,90 C120,62 280,62 400,84 L400,300 L0,300 Z"/></clipPath>`, h) +
      `<path d="M0,90 C120,62 280,62 400,84 L400,300 L0,300 Z" fill="url(#${id}p)"/>
       <g clip-path="url(#${id}c)">${swirls}
         ${after
           ? `<path d="M0,150 C140,122 260,122 400,140 L400,150 C260,134 140,134 0,162 Z" fill="#fff" opacity=".75"/>
              <path d="M0,196 C140,172 260,172 400,188 L400,193 C260,179 140,179 0,203 Z" fill="#FF5A1F" opacity=".7"/>`
           : `<path d="M0,150 C140,122 260,122 400,140 L400,162 C260,146 140,146 0,174 Z" fill="#fff" opacity=".16" filter="url(#${id}b)"/>`}
       </g></svg>`;
  }

  if (kind === "dent") {
    let lines = "";
    for (let k = 0; k < 6; k++) {
      const y = 110 + k * 34;
      lines += after
        ? `<path d="M0,${y} L400,${y - 6}" stroke="#fff" stroke-opacity="${0.12 + k * 0.03}" stroke-width="2" fill="none"/>`
        : `<path d="M0,${y} C150,${y} 160,${y + 26 - Math.abs(k - 2.5) * 6} 200,${y + 30 - Math.abs(k - 2.5) * 7} C240,${y + 26 - Math.abs(k - 2.5) * 6} 250,${y} 400,${y - 6}" stroke="#fff" stroke-opacity="${0.12 + k * 0.03}" stroke-width="2" fill="none"/>`;
    }
    return open(`<linearGradient id="${id}d" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a2c31"/><stop offset="1" stop-color="#101114"/></linearGradient>
      <radialGradient id="${id}r" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset=".7" stop-color="#000" stop-opacity=".15"/><stop offset="1" stop-color="#fff" stop-opacity=".08"/></radialGradient>`) +
      `<rect x="0" y="60" width="400" height="300" fill="url(#${id}d)"/>
       <path d="M0,74 L400,66" stroke="#4a4d54" stroke-width="3"/>
       <rect x="300" y="200" width="60" height="16" rx="8" fill="#0a0a0b" stroke="#3a3c42"/>
       ${after ? "" : `<ellipse cx="200" cy="215" rx="110" ry="78" fill="url(#${id}r)"/>`}
       ${lines}</svg>`;
  }

  if (kind === "seat") {
    const leather = after ? "#2b2420" : "#2a2420";
    const stains = after ? "" : `<g filter="url(#${id}b)"><ellipse cx="170" cy="150" rx="36" ry="24" fill="#6b5638" opacity=".55"/><ellipse cx="230" cy="290" rx="44" ry="18" fill="#6b5638" opacity=".5"/><ellipse cx="240" cy="110" rx="20" ry="14" fill="#7a6448" opacity=".45"/></g>`;
    const stitch = after ? "#FF5A1F" : "#5a4a3c";
    return open(`<linearGradient id="${id}l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".4"/><stop offset=".45" stop-color="#fff" stop-opacity="${after ? ".12" : ".03"}"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></linearGradient>`) +
      `<rect x="112" y="40" width="176" height="230" rx="46" fill="${leather}"/>
       <rect x="112" y="40" width="176" height="230" rx="46" fill="url(#${id}l)"/>
       <rect x="92" y="252" width="216" height="100" rx="34" fill="${leather}"/>
       <rect x="92" y="252" width="216" height="100" rx="34" fill="url(#${id}l)"/>
       <g stroke="${stitch}" stroke-width="2" stroke-dasharray="5 5" fill="none">
         <path d="M160,60 L160,250M240,60 L240,250M140,272 L140,336M260,272 L260,336"/>
       </g>
       <rect x="150" y="8" width="100" height="40" rx="18" fill="${leather}"/>
       ${stains}</svg>`;
  }
  return "";
}

function Reveal({ children, delay = 0, className = "", as = "div" }) {
  const reduce = useReducedMotion();
  const C = motion[as];
  return html`<${C} className=${className}
    initial=${reduce ? false : { opacity: 0.12, y: 36 }}
    whileInView=${{ opacity: 1, y: 0 }}
    viewport=${{ once: true, amount: 0.15 }}
    transition=${{ duration: 0.8, delay, ease: [0.22, 1, 0.36, 1] }}>${children}<//>`;
}

        <a href="#book" onClick=${() => setOpen(false)} className="btn btn-primary" style=${{ marginTop: 20, textDecoration: "none" }}>Записаться на сервис</a>
      </div>
    <//>`}<//>
  </header>`;

function Hero() {

            Диагностика, ТО и ремонт по регламентам производителя. Каждую работу согласуем до начала и присылаем фотоотчёт.
          <//>
          <${motion.div} className="flex flex-wrap gap-3" style=${{ marginTop: 34 }} ...${intro(0.5)}>
            <${motion.a} href="#book" className="btn btn-primary" style=${{ textDecoration: "none" }} whileHover=${{ y: -2 }} whileTap=${{ scale: 0.97 }}>
              Записаться на сервис <span className="arrow" aria-hidden="true">→</span>
            <//>

              <span className="tnum">${SITE.phone}</span>
            <//>
          <//>
          <${motion.p} className="spec" style=${{ marginTop: 36 }} ...${intro(0.65)}>
            <b>${SITE.bays}</b> постов · <b>3D</b>-развал · дилерские сканеры · гарантия <b>${SITE.warrantyMonths}</b> мес.
          <//>
        </div>
        <${motion.div} className="glass" style=${{ borderRadius: 24, padding: "22px 24px", width: "min(100%, 300px)" }}
          ...${reduce ? {} : { initial: { opacity: 0, x: 30 }, animate: { opacity: 1, x: 0 }, transition: { duration: 1, delay: 0.7, ease: [0.22, 1, 0.36, 1] } }}>

              <div style=${{ color: "var(--accent)", letterSpacing: 2, fontSize: 15 }} aria-label="Пять звёзд">★★★★★</div>
              <div className="muted" style=${{ fontSize: 13 }}>рейтинг на картах</div>
            </div>
          </div>
          <div style=${{ height: 1, background: "var(--line)", margin: "16px 0" }}></div>

          <div className="flex" style=${{ marginTop: 12 }}>
            ${["#ff8a55", "#c9ced4", "#7b8087", "#3a3d44"].map((c, i) => html`<span key=${i} style=${{ width: 30, height: 30, borderRadius: "50%", background: c, border: "2px solid #1a1a1d", marginLeft: i ? -8 : 0 }}></span>`)}
          </div>
        <//>
      </div>
    <//>
  </section>`;

          <//>
        <//>`)}

function Counter({ to, duration = 1.8 }) {
  const ref = useRef(null);
  const inView = useInView(ref, { once: true, amount: 0.6 });
  const reduce = useReducedMotion();
  const [v, setV] = useState(reduce ? to : 0);
  useEffect(() => {
    if (!inView || reduce) return;
    const c = animate(0, to, { duration, ease: [0.16, 1, 0.3, 1], onUpdate: (x) => setV(Math.round(x)) });
    return () => c.stop();
  }, [inView]);
  return html`<span ref=${ref} className="tnum">${v.toLocaleString("ru-RU")}</span>`;
}

function BeforeAfter({ w, idx }) {
  const [pos, setPos] = useState(50);
  const before = useMemo(() => scene(w.kind, "before", "b" + idx), []);
  const after = useMemo(() => scene(w.kind, "after", "a" + idx), []);
  return html`<${Reveal} delay=${(idx % 3) * 0.08}>
    <figure className="ba" style=${{ aspectRatio: w.ratio, "--pos": pos + "%", margin: "0 0 18px" }}>
      <div className="ba-layer" dangerouslySetInnerHTML=${{ __html: after }}></div>
      <div className="ba-layer ba-before" dangerouslySetInnerHTML=${{ __html: before }}></div>
      <div className="ba-handle"></div>
      <span className="ba-tag" style=${{ left: 14 }}>До</span>
      <span className="ba-tag" style=${{ right: 14, color: "var(--accent)" }}>После</span>
      <figcaption className="ba-cap">
        <span className="spec">${w.tag}</span>
        <div className="display" style=${{ fontSize: 19, fontWeight: 600, marginTop: 2 }}>${w.title}</div>
      </figcaption>
      <input id=${"ba-" + idx} type="range" min="0" max="100" value=${pos} onInput=${(e) => setPos(+e.target.value)} onChange=${(e) => setPos(+e.target.value)} aria-label=${"Сравнить до и после: " + w.title} />
    </figure>
  <//>`;
}

function Reviews() {
  const [i, setI] = useState(0);
  const [dir, setDir] = useState(1);
  const [paused, setPaused] = useState(false);
  const reduce = useReducedMotion();
  const go = (d) => { setDir(d); setI((p) => (p + d + REVIEWS.length) % REVIEWS.length); };
  useEffect(() => {
    if (paused || reduce) return;
    const t = setInterval(() => go(1), 6500);
    return () => clearInterval(t);
  }, [paused, i]);
  const r = REVIEWS[i];
  const next = REVIEWS[(i + 1) % REVIEWS.length];
  return html`<section id="reviews" style=${{ background: "var(--bg-2)", borderBlock: "1px solid var(--line)" }}>
    <div className="wrap" style=${{ paddingBlock: 110 }}>
      <${SectionHead} eyebrow="Отзывы" title="Что говорят владельцы" />
      <div className="grid gap-5 lg:grid-cols-[1.6fr_1fr]" style=${{ marginTop: 56 }} onMouseEnter=${() => setPaused(true)} onMouseLeave=${() => setPaused(false)}>
        <div style=${{ position: "relative", minWidth: 0, minHeight: 330 }} aria-live="polite">
          <${AnimatePresence} mode="wait" custom=${dir}>
            <${motion.blockquote} key=${i} className="review-card glass" style=${{ margin: 0, height: "100%" }}
              initial=${reduce ? false : { opacity: 0, x: dir * 60 }} animate=${{ opacity: 1, x: 0 }} exit=${reduce ? {} : { opacity: 0, x: dir * -60 }}
              transition=${{ duration: 0.45, ease: [0.22, 1, 0.36, 1] }}
              drag=${reduce ? false : "x"} dragConstraints=${{ left: 0, right: 0 }} dragElastic=${0.2}
              onDragEnd=${(e, info) => { if (info.offset.x < -60) go(1); else if (info.offset.x > 60) go(-1); }}>
              <div className="flex items-center justify-between">
                <span style=${{ color: "var(--accent)", letterSpacing: 3 }} aria-label="Пять звёзд">★★★★★</span>
                <span className="spec" style=${{ border: "1px solid var(--line)", borderRadius: 999, padding: "3px 10px", letterSpacing: ".1em" }}>Пример отзыва</span>
              </div>
              <p className="display" style=${{ fontSize: "clamp(20px,2.3vw,28px)", lineHeight: 1.35, fontWeight: 500, margin: "26px 0 30px", letterSpacing: "-0.01em" }}>«${r.text}»</p>
              <footer className="flex items-center gap-3">
                <span className="display" style=${{ width: 44, height: 44, borderRadius: "50%", background: "var(--accent-soft)", color: "var(--accent)", display: "grid", placeItems: "center", fontWeight: 700 }}>${r.name[0]}</span>
                <div><div style=${{ fontWeight: 500 }}>${r.name}</div><div className="muted" style=${{ fontSize: 14 }}>${r.car}</div></div>
              </footer>
            <//>
          <//>
        </div>
        <div className="flex flex-col gap-5" style=${{ minWidth: 0 }}>
          <button className="glass hidden lg:block text-left" onClick=${() => go(1)} style=${{ borderRadius: 24, padding: 28, color: "var(--fg)", cursor: "pointer", flex: 1, font: "inherit" }}>
            <span className="spec">Следующий · ${next.car}</span>
            <p className="muted" style=${{ margin: "12px 0 0", fontSize: 15, display: "-webkit-box", WebkitLineClamp: 4, WebkitBoxOrient: "vertical", overflow: "hidden" }}>${next.text}</p>
          </button>
          <div className="flex items-center justify-between gap-4">
            <div className="flex items-center gap-2" role="tablist" aria-label="Выбор отзыва">
              ${REVIEWS.map((_, k) => html`<button key=${k} className=${"dot " + (k === i ? "on" : "")} role="tab" aria-selected=${k === i} aria-label=${"Отзыв " + (k + 1)} onClick=${() => { setDir(k > i ? 1 : -1); setI(k); }}></button>`)}
            </div>
            <div className="flex gap-2">
              <${motion.button} className="round-btn" aria-label="Предыдущий отзыв" onClick=${() => go(-1)} whileTap=${{ scale: 0.9 }}>←<//>
              <${motion.button} className="round-btn" aria-label="Следующий отзыв" onClick=${() => go(1)} whileTap=${{ scale: 0.9 }}>→<//>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>`;
}

function Booking() {
  const today = new Date();
  const iso = (d) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  const tomorrow = new Date(today.getTime() + 86400000);
  const [form, setForm] = useState({ name: "", phone: "", service: SERVICES[0].title, date: iso(tomorrow), slot: "10:30" });
  const [errors, setErrors] = useState({});
  const [done, setDone] = useState(false);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const submit = (e) => {
    e.preventDefault();
    const er = {};
    if (form.name.trim().length < 2) er.name = "Укажите имя, чтобы мастер знал, как к вам обращаться.";
    if (form.phone.replace(/\D/g, "").length < 9) er.phone = "Нужен номер телефона целиком, минимум 9 цифр.";
    if (!form.date) er.date = "Выберите дату визита.";
    setErrors(er);
    if (!Object.keys(er).length) setDone(true);
  };
  const dateLabel = form.date ? new Date(form.date + "T12:00").toLocaleDateString("ru-RU", { day: "numeric", month: "long", weekday: "long" }) : "";

  return html`<section id="book" style=${{ position: "relative", overflow: "hidden" }}>
    <div aria-hidden="true" style=${{ position: "absolute", left: "-15%", bottom: "-30%", width: 700, height: 700, borderRadius: "50%", background: "radial-gradient(circle, rgba(255,90,31,.13), transparent 65%)", pointerEvents: "none" }}></div>
    <div className="wrap grid gap-14 lg:grid-cols-[1fr_1.15fr]" style=${{ paddingBlock: 110, position: "relative" }}>
      <${Reveal}>
        <p className="eyebrow" style=${{ margin: 0 }}>Запись</p>
        <h2 style=${{ fontSize: "clamp(34px,4.6vw,60px)", lineHeight: 1.02, margin: "14px 0 20px", fontWeight: 700 }}>Выберите услугу и удобное время</h2>
        <p className="muted" style=${{ fontSize: 17, maxWidth: 440, margin: 0 }}>Перезвоним в течение 15 минут в рабочее время, уточним симптомы и подтвердим запись.</p>
        <div style=${{ marginTop: 36 }}>
          ${SITE.hours.map(([d, h]) => html`<div key=${d} className="flex justify-between tnum" style=${{ maxWidth: 340, padding: "12px 0", borderBottom: "1px solid var(--line)" }}><span className="muted">${d}</span><span>${h}</span></div>`)}
        </div>
      <//>
      <${Reveal} delay=${0.1}>
        <div className="glass" style=${{ borderRadius: 28, padding: "clamp(24px,4vw,44px)" }}>
          <${AnimatePresence} mode="wait">
          ${done ? html`<${motion.div} key="ok" initial=${{ opacity: 0, scale: 0.96 }} animate=${{ opacity: 1, scale: 1 }} style=${{ textAlign: "center", padding: "30px 0" }} role="status">
              <div style=${{ width: 72, height: 72, margin: "0 auto", borderRadius: "50%", background: "var(--accent)", display: "grid", placeItems: "center", color: "#140700", fontSize: 32, boxShadow: "0 0 50px rgba(255,90,31,.6)" }}>✓</div>
              <h3 style=${{ fontSize: 28, margin: "24px 0 8px" }}>Заявка готова</h3>
              <p className="muted" style=${{ margin: "0 auto", maxWidth: 380 }}>${form.name}, ${form.service.toLowerCase()} — ${dateLabel}, ${form.slot}. Это демо-версия сайта: заявка никуда не отправлена.</p>
              <button className="btn btn-ghost" style=${{ marginTop: 26 }} onClick=${() => setDone(false)}>Изменить запись</button>
            <//>` : html`<${motion.form} key="f" onSubmit=${submit} noValidate className="grid gap-7" initial=${{ opacity: 0 }} animate=${{ opacity: 1 }} exit=${{ opacity: 0 }}>
              <div className="grid gap-7 sm:grid-cols-2">
                <div className="field"><label htmlFor="f-name">Имя</label><input id="f-name" autoComplete="name" placeholder="Как к вам обращаться" value=${form.name} onInput=${set("name")} />${errors.name && html`<p className="err">${errors.name}</p>`}</div>
                <div className="field"><label htmlFor="f-phone">Телефон</label><input id="f-phone" type="tel" autoComplete="tel" placeholder="+375 (__) ___-__-__" value=${form.phone} onInput=${set("phone")} />${errors.phone && html`<p className="err">${errors.phone}</p>`}</div>
              </div>
              <div className="grid gap-7 sm:grid-cols-2">
                <div className="field"><label htmlFor="f-service">Услуга</label>
                  <select id="f-service" value=${form.service} onChange=${set("service")}>${SERVICES.map((s) => html`<option key=${s.title}>${s.title}</option>`)}</select></div>
                <div className="field"><label htmlFor="f-date">Дата</label><input id="f-date" type="date" min=${iso(today)} value=${form.date} onInput=${set("date")} onChange=${set("date")} />${errors.date && html`<p className="err">${errors.date}</p>`}</div>
              </div>
              <div className="field">
                <label>Время</label>
                <div className="flex flex-wrap gap-2" role="group" aria-label="Время визита">
                  ${SLOTS.map((t) => html`<${motion.button} key=${t} type="button" className="chip tnum" aria-pressed=${form.slot === t} onClick=${() => setForm({ ...form, slot: t })} whileTap=${{ scale: 0.94 }}>${t}<//>`)}
                </div>
              </div>
              <div className="flex flex-wrap items-center justify-between gap-4" style=${{ marginTop: 6 }}>
                <p className="demo-note" style=${{ margin: 0, maxWidth: 260 }}>Нажимая кнопку, вы соглашаетесь на обработку контактных данных для записи.</p>
                <${motion.button} type="submit" className="btn btn-primary" whileHover=${{ y: -2 }} whileTap=${{ scale: 0.97 }}>Записаться <span className="arrow" aria-hidden="true">→</span><//>
              </div>
            <//>`}
          <//>
        </div>
      <//>
    </div>
  </section>`;
}

function Footer() {
  const [copied, setCopied] = useState(false);
  const copy = async () => {
    try { await navigator.clipboard.writeText(SITE.phone); setCopied(true); setTimeout(() => setCopied(false), 1600); }
    catch (e) { const el = document.getElementById("phone-text"); const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  };
  return html`<footer id="contacts" style=${{ borderTop: "1px solid var(--line)" }}>
    <div className="wrap grid gap-12 lg:grid-cols-[1.3fr_1fr]" style=${{ paddingBlock: "92px 40px" }}>
      <${Reveal}>
        <a href=${SITE.mapUrl} target="_blank" rel="noopener" className="map block" aria-label="Открыть на Яндекс Картах"><${MapArt} /></a>
        <a href=${SITE.mapUrl} target="_blank" rel="noopener" className="muted" style=${{ display: "inline-block", marginTop: 12, fontSize: 14 }}>Открыть маршрут на Яндекс Картах ↗</a>
      <//>
      <${Reveal} delay=${0.1} className="flex flex-col gap-8">
        <div>
          <p className="eyebrow" style=${{ margin: 0 }}>Контакты</p>

            <button className="copy-btn" onClick=${copy}>${copied ? "Скопировано" : "Копировать"}</button>
          </div>
        </div>
        <div>
          <div className="spec" style=${{ marginBottom: 6 }}>Часы работы</div>
          ${SITE.hours.map(([d, h]) => html`<div key=${d} className="tnum"><span className="muted" style=${{ display: "inline-block", width: 70 }}>${d}</span>${h}</div>`)}
